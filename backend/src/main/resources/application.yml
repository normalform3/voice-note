spring:
  config:
    # Supports Maven runs from backend/ and IDE runs from the repository root.
    # Process environment variables take precedence over values in either file.
    import: optional:file:./.env[.properties],optional:file:./backend/.env[.properties]
  application:
    name: voicenote-api
  datasource:
    url: ${VOICENOTE_DB_URL}
    username: ${VOICENOTE_DB_USERNAME}
    password: ${VOICENOTE_DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 1GB
      max-request-size: 1GB

server:
  port: ${SERVER_PORT:8080}

rocketmq:
  # RocketMQ starter resolves this before app.rocketmq.enabled is evaluated.
  # Keep the local tunnel default so MQ can remain disabled without this variable.
  name-server: ${VOICENOTE_ROCKETMQ_NAMESRV:127.0.0.1:9876}
  producer:
    group: voicenote-api-producer

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  security:
    jwt-secret: ${VOICENOTE_JWT_SECRET}
    token-ttl-hours: ${JWT_TTL_HOURS:24}
  storage:
    endpoint: ${VOICENOTE_MINIO_ENDPOINT}
    access-key: ${VOICENOTE_MINIO_ACCESS_KEY}
    secret-key: ${VOICENOTE_MINIO_SECRET_KEY}
    bucket: ${VOICENOTE_MINIO_BUCKET}
  rocketmq:
    enabled: ${ROCKETMQ_ENABLED:false}
    transcription-topic: ${ROCKETMQ_TRANSCRIPTION_TOPIC:voicenote-transcription}
    document-topic: ${ROCKETMQ_DOCUMENT_TOPIC:voicenote-document}
    knowledge-topic: ${ROCKETMQ_KNOWLEDGE_TOPIC:voicenote-knowledge}
    analysis-topic: ${ROCKETMQ_ANALYSIS_TOPIC:voicenote-analysis}
  dashscope:
    enabled: ${DASHSCOPE_ENABLED:false}
    api-key: ${DASHSCOPE_API_KEY:}
    base-url: ${DASHSCOPE_BASE_URL:https://dashscope.aliyuncs.com/api/v1}
    asr-model: ${DASHSCOPE_ASR_MODEL:paraformer-v2}
    chat-model: ${DASHSCOPE_CHAT_MODEL:qwen-plus}
    embedding-model: ${DASHSCOPE_EMBEDDING_MODEL:text-embedding-v4}
    embedding-dimension: ${DASHSCOPE_EMBEDDING_DIMENSION:1024}
  workers:
    enabled: ${WORKERS_ENABLED:true}
    poll-interval-ms: ${WORKER_POLL_INTERVAL_MS:5000}
    recovery-interval-ms: ${WORKER_RECOVERY_INTERVAL_MS:30000}
  knowledge:
    enabled: ${VOICENOTE_KNOWLEDGE_ENABLED:false}
    qdrant-url: ${VOICENOTE_QDRANT_URL:http://127.0.0.1:6333}
    qdrant-api-key: ${VOICENOTE_QDRANT_API_KEY:}
    collection: ${VOICENOTE_QDRANT_COLLECTION:voicenote_knowledge}
    chunk-characters: ${VOICENOTE_KNOWLEDGE_CHUNK_CHARACTERS:2000}
    short-topic-tokens: ${VOICENOTE_KNOWLEDGE_SHORT_TOPIC_TOKENS:200}
    chunk-target-tokens: ${VOICENOTE_KNOWLEDGE_CHUNK_TARGET_TOKENS:800}
    chunk-max-tokens: ${VOICENOTE_KNOWLEDGE_CHUNK_MAX_TOKENS:1200}
    retrieval-prefetch-limit: ${VOICENOTE_KNOWLEDGE_RETRIEVAL_PREFETCH_LIMIT:50}
    retrieval-seed-limit: ${VOICENOTE_KNOWLEDGE_RETRIEVAL_SEED_LIMIT:4}
    retrieval-context-max-chunks: ${VOICENOTE_KNOWLEDGE_CONTEXT_MAX_CHUNKS:12}
    retrieval-context-max-tokens: ${VOICENOTE_KNOWLEDGE_CONTEXT_MAX_TOKENS:10000}
